# Fails any push or pull request that adds a file without a license.
# The path-to-license map lives in REUSE.toml.
name: License check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
