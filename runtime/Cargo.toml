# Diamond Dog, the runtime: an experimental skeleton of the enforcement core,
# answering the provisional contract. The real runtime's language and
# architecture still wait on the experiment gate; see README.md.
[package]
name = "diamond-dog"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tiny_http = "0.12"
