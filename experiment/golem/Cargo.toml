# The Golem component for Scenario A. Built with `golem build` for
# wasm32-wasip2; kept out of the native workspace.
[package]
name = "scenario_a_main"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = "s"
lto = true
strip = "symbols"

[dependencies]
golem-rust = { version = "3.0.0", features = ["export_golem_agentic"] }
orca-ref = { path = "../shared/orca-ref" }
scenario-task = { path = "../shared/scenario-task" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Golem's fork of wit-bindgen, as its Rust template requires.
[patch.crates-io]
wit-bindgen = { git = "https://github.com/golemcloud/wit-bindgen", branch = "wit-bindgen-golem-1.6", version = "=0.59.0" }

[workspace]
