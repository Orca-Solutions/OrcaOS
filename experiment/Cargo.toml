# Native workspace for the Scenario A experiment: the shared reference
# implementation, the shared task logic, the mock mail service and the test
# harness. The Golem application under golem/ builds separately, with
# `golem build`, for wasm32-wasip2.
[workspace]
resolver = "2"
members = [
    "shared/orca-ref",
    "shared/scenario-task",
    "mock-mail",
    "harness",
]
exclude = ["golem"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
