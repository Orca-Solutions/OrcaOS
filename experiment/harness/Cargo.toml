# The test harness: drives the Golem build through the golem CLI and the mock
# mail service's control port, injects faults and crashes, runs the
# acceptance tests and writes the results with their reproducibility record.
[package]
name = "harness"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
