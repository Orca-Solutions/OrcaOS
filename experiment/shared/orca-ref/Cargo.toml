# The shared reference implementation: consumption journaling, request
# identifiers and receipt updates. Supplied unchanged to every platform build
# and excluded from the custom-machinery comparison.
[package]
name = "orca-ref"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
